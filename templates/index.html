<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My weather app</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body class="bg-info text-white">
    <div class="text-center">

        <h1 class="mt-5">Weather App</h1>
        <form action="/" method="post">
            <label for="cityName" class="form-label mt-3">City Name:</label>
            <input type="text" id="cityName" name="cityName" placeholder="Enter city name" class="form-control w-50 mx-auto mt-3">
            <label for="stateName" class="form-label mt-3">State Name:</label>
            <input type="text" id="stateName" name="stateName" value="ON" class="form-control w-50 mx-auto mt-3">
            <label for="countryName" class="form-label mt-3">Country Name:</label>
            <input type="text" id="countryName" name="countryName" value="Canada" class="form-control w-50 mx-auto mt-3">
            <button type="submit" class="btn btn-primary mt-3">Find</button>

        </form>
        {% if data %}
        <p>{{data.main}} : {{data.description}}</p> <br>
        <img src="https://openweathermap.org/img/wn/{{data.icon}}@2x.png" alt="Icon"> <br>
        <p>Temperature: {{data.temperature}}°C</p>
        {% endif %}
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
            crossorigin="anonymous"></script>

    </div>
</body>

</html>
